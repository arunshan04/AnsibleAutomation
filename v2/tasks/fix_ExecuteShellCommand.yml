- name: "Check if file exists for backup - {{ item.cis_subsection }} - {{ item.name }}"
  ansible.builtin.stat:
    path: "{{ item.select }}"
  register: backup_file_stat
  when: item.select is defined and item.select != ''
  tags: always

- name: "Backup file before fix for {{ item.cis_subsection }} - {{ item.name }}"
  ansible.builtin.copy:
    src: "{{ item.select }}"
    dest: "{{ item.select }}.backup.{{item.cis_subsection}}_{{ ansible_date_time.epoch }}"
    remote_src: yes
  when: item.select is defined and item.select != '' and backup_file_stat.stat.exists
  tags: always

- name: "Execute Fix Command for {{ item.cis_subsection }} - {{ item.name }}"
  ansible.builtin.shell: "{{ item.target }}"
  register: shellOutput_check
  changed_when: false
  failed_when: false
  tags: always

- name: Debug
  debug:
    var: shellOutput_check
  tags: always

- name: Set compliance result
  set_fact:
    fs_result: "{{ 'PASS' if shellOutput_check.rc == 0 else 'FAIL' }}"
  tags: always

- name: "Save compliance result for {{ item.name }}"
  set_fact:
    cis_results: >-
      {{
        cis_results | combine({
          item.name: {
            'cis_subsection': item.cis_subsection,
            'result': fs_result,
            'cis_section': item.cis_section,
            'name': item.name
          }
        })
      }}
    passed_ids: "{{ passed_ids + [item.cis_subsection] if fs_result == 'PASS' else passed_ids }}"
    failed_ids: "{{ failed_ids + [item.cis_subsection] if fs_result == 'FAIL' else failed_ids }}"
  tags: always
